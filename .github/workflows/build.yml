name: Build Neo Parser

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows 10/11 x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run core tests
        run: python -m pytest tests/ -q --tb=short

      - name: Build Windows executable
        shell: pwsh
        run: |
          $icon = if (Test-Path "assets/icon.ico") { "assets/icon.ico" } else { $null }
          $args = @(
            "--noconfirm", "--clean", "--onefile", "--windowed",
            "--name", "NeoParser",
            "--collect-all", "PySide6",
            "--collect-all", "shiboken6"
          )
          if ($icon) {
            $args += @("--icon", $icon)
            $args += @("--add-data", "assets/icon.png;assets")
            $args += @("--add-data", "assets/icon.ico;assets")
          }
          $args += "main.py"
          pyinstaller @args

      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/NeoParser.exe")) {
            throw "Build failed: dist/NeoParser.exe was not created"
          }
          Get-Item "dist/NeoParser.exe" | Format-List Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Parser-Windows-x64
          path: dist/NeoParser.exe
          if-no-files-found: error

  macos-arm64:
    name: Build macOS Apple Silicon (M1+)
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify runner architecture
        run: |
          echo "uname -m: $(uname -m)"
          echo "sw_vers:"
          sw_vers
          python -c "import platform; print(platform.platform()); print(platform.machine())"
          test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run core tests
        run: python -m pytest tests/ -q --tb=short

      - name: Build macOS application
        run: |
          set -euo pipefail
          # Do NOT pass --target-architecture on native arm64 runners.
          # Spaces in --name break paths; use NeoParser.
          ICON_ARGS=()
          if [ -f assets/icon.png ]; then
            ICON_ARGS+=(--icon assets/icon.png --add-data "assets/icon.png:assets")
          fi
          pyinstaller --noconfirm --clean --windowed \
            --name NeoParser \
            --osx-bundle-identifier com.neki.neoparser \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            "${ICON_ARGS[@]}" \
            main.py

          echo "=== dist listing ==="
          ls -la dist/
          ls -la dist/NeoParser.app/Contents/MacOS/ || true

      - name: Ad-hoc codesign (unsigned distribution)
        run: |
          set -euo pipefail
          APP="dist/NeoParser.app"
          test -d "$APP"
          # Ad-hoc sign so Gatekeeper is less aggressive on first launch
          codesign --force --deep --sign - "$APP" || true
          codesign -dv --verbose=2 "$APP" || true

      - name: Verify app bundle
        run: |
          set -euo pipefail
          test -d "dist/NeoParser.app/Contents/MacOS"
          BIN="dist/NeoParser.app/Contents/MacOS/NeoParser"
          test -f "$BIN"
          file "$BIN"
          # Must be arm64 Mach-O
          file "$BIN" | grep -qi "arm64\|Mach-O"

      - name: Create DMG
        run: |
          set -euo pipefail
          hdiutil create \
            -volname "Neo Parser" \
            -srcfolder "dist/NeoParser.app" \
            -ov -format UDZO \
            "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"
          ls -lh "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Parser-macOS-Apple-Silicon-arm64
          path: dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Neo-Parser-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NeoParser.exe
            artifacts/Neo-Parser-macOS-Apple-Silicon-arm64.dmg
          fail_on_unmatched_files: true
