name: Build Neo Parser

# Цели:
#   - Windows 10/11 x64  →  Neo Parser.exe
#   - macOS Apple Silicon (M1 / M2 / M3 / M4)  →  DMG
# Intel Mac намеренно не поддерживается.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Windows 10/11 x64
  # ─────────────────────────────────────────────
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest tests/ -q --tb=short

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Neo Parser" `
            --icon "assets/icon.ico" `
            --add-data "assets/icon.png;assets" `
            --add-data "assets/icon.ico;assets" `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            main.py

      - name: Verify
        shell: pwsh
        run: |
          $exe = "dist/Neo Parser.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          Get-Item -LiteralPath $exe | Format-List FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Neo-Parser-Windows-x64
          path: "dist/Neo Parser.exe"
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # macOS Apple Silicon only (M1+)
  # ─────────────────────────────────────────────
  # runs-on: macos-latest  →  на GitHub-hosted сейчас arm64 (Apple Silicon).
  # macos-14 у части аккаунтов недоступен — не используем.
  # --target-architecture НЕ ставим: раннер уже native arm64.
  macos:
    name: macOS Apple Silicon (M1+)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require Apple Silicon
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          echo "uname -m = $ARCH"
          sw_vers
          python -c "import platform; print(platform.machine(), platform.platform())"
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::Нужен Apple Silicon runner (arm64). Сейчас: $ARCH"
            echo "Intel Mac не поддерживается. Соберите локально на M1+ : scripts/build_macos.sh"
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest tests/ -q --tb=short

      - name: Build .app
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --windowed \
            --name "Neo Parser" \
            --icon "assets/icon.png" \
            --add-data "assets/icon.png:assets" \
            --osx-bundle-identifier com.neki.neoparser \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            main.py

          test -d "dist/Neo Parser.app"
          test -x "dist/Neo Parser.app/Contents/MacOS/Neo Parser"
          file "dist/Neo Parser.app/Contents/MacOS/Neo Parser"

      - name: Confirm binary is arm64
        run: |
          set -euo pipefail
          BIN="dist/Neo Parser.app/Contents/MacOS/Neo Parser"
          INFO="$(file "$BIN")"
          echo "$INFO"
          echo "$INFO" | grep -qi "arm64" || {
            echo "::error::Бинарник не arm64 — это не сборка для M1+"
            exit 1
          }

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - "dist/Neo Parser.app" || true

      - name: DMG
        run: |
          set -euo pipefail
          hdiutil create \
            -volname "Neo Parser" \
            -srcfolder "dist/Neo Parser.app" \
            -ov -format UDZO \
            "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"
          ls -lh "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Neo-Parser-macOS-Apple-Silicon-arm64
          path: "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Release (только с тега v*)
  # ─────────────────────────────────────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Neo-Parser-*
          path: artifacts
          merge-multiple: true

      - run: find artifacts -type f -ls

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Neo Parser.exe
            artifacts/Neo-Parser-macOS-Apple-Silicon-arm64.dmg
          fail_on_unmatched_files: true
          body: |
            **Neo Parser**
            - Windows 10/11 x64 — `Neo Parser.exe`
            - macOS Apple Silicon (M1+) — `Neo-Parser-macOS-Apple-Silicon-arm64.dmg`
            Intel Mac не поддерживается.
