name: NEO PARSER - FULL CROSS-PLATFORM BUILD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Neo_parser_win64
            asset_path: "dist/Neo parser/"
          - os: macos-latest
            artifact_name: Neo_parser_macos_arm64
            asset_path: "dist/Neo parser.app"
          - os: macos-15-intel
            artifact_name: Neo_parser_macos_intel
            asset_path: "dist/Neo parser.app"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7" pyinstaller-hooks-contrib

      - name: Install Playwright Headless Shell (inside package)
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          python -m playwright install chromium --only-shell

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Neo parser" \
            --add-data "static:static" \
            --add-data "assets:assets" \
            --collect-all playwright \
            --collect-all webview \
            --hidden-import="playwright.async_api" \
            --hidden-import="playwright.sync_api" \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module IPython \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module pandas \
            --exclude-module webview.platforms.android \
            app.py

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}