name: Build Neo Parser

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows 10/11 x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "Neo Parser"
          --collect-all PySide6
          --collect-all shiboken6
          main.py

      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/Neo Parser.exe")) {
            throw "Build failed: dist/Neo Parser.exe was not created"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Neo-Parser-Windows-x64
          path: dist/Neo Parser.exe
          if-no-files-found: error

  macos-arm64:
    name: Build macOS Apple Silicon (M1 and newer)
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Build macOS application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name "Neo Parser"
          --target-architecture arm64
          --osx-bundle-identifier com.neki.neoparser
          --collect-all PySide6
          --collect-all shiboken6
          main.py

      - name: Verify macOS application
        run: test -d "dist/Neo Parser.app"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Neo Parser" \
            -srcfolder "dist/Neo Parser.app" \
            -ov -format UDZO \
            "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"

      - name: Upload macOS build
        uses: actions/upload-artifact@v6
        with:
          name: Neo-Parser-macOS-Apple-Silicon-arm64
          path: dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and macOS builds
        uses: actions/download-artifact@v7
        with:
          pattern: Neo-Parser-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/Neo Parser.exe
            artifacts/Neo-Parser-macOS-Apple-Silicon-arm64.dmg
          fail_on_unmatched_files: true
