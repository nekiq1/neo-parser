name: Build Neo Parser

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows 10/11 x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path "assets/icon.ico") {
            $iconArgs = @(
              "--icon", "assets/icon.ico",
              "--add-data", "assets/icon.png;assets",
              "--add-data", "assets/icon.ico;assets"
            )
          }
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Neo Parser" `
            @iconArgs `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --collect-all playwright `
            main.py

      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/Neo Parser.exe")) {
            throw "Build failed: dist/Neo Parser.exe was not created"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Neo-Parser-Windows-x64
          path: "dist/Neo Parser.exe"
          if-no-files-found: error

  macos-arm64:
    name: Build macOS Apple Silicon (M1+)
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Build macOS application
        run: |
          set -euo pipefail
          # macOS PyInstaller accepts ONLY .icns for --icon (not .png)
          ICON_ARGS=()
          if [ -f assets/icon.icns ]; then
            ICON_ARGS+=(--icon assets/icon.icns)
          fi
          if [ -f assets/icon.png ]; then
            ICON_ARGS+=(--add-data "assets/icon.png:assets")
          fi
          if [ -f assets/icon.icns ]; then
            ICON_ARGS+=(--add-data "assets/icon.icns:assets")
          fi
          pyinstaller --noconfirm --clean --windowed \
            --name "Neo Parser" \
            --target-architecture arm64 \
            --osx-bundle-identifier com.neki.neoparser \
            "${ICON_ARGS[@]}" \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --collect-all playwright \
            main.py

      - name: Verify app bundle
        run: |
          test -d "dist/Neo Parser.app/Contents/MacOS"
          file "dist/Neo Parser.app/Contents/MacOS/Neo Parser"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Neo Parser" \
            -srcfolder "dist/Neo Parser.app" \
            -ov -format UDZO \
            "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"

      - name: Upload macOS build
        uses: actions/upload-artifact@v6
        with:
          name: Neo-Parser-macOS-Apple-Silicon-arm64
          path: "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Neo-Parser-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Neo Parser.exe
            artifacts/Neo-Parser-macOS-Apple-Silicon-arm64.dmg
          fail_on_unmatched_files: true
