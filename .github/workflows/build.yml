name: Build Neo Parser
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name "Neo Parser" --collect-all PySide6 main.py
      - uses: actions/upload-artifact@v4
        with: { name: Neo-Parser-Windows-x64, path: dist/Neo Parser.exe }
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name "Neo Parser" --osx-bundle-identifier com.neki.neoparser --collect-all PySide6 main.py
      - run: hdiutil create -volname "Neo Parser" -srcfolder "dist/Neo Parser.app" -ov -format UDZO "dist/Neo-Parser-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Neo-Parser-macOS-${{ matrix.arch }}
          path: dist/*.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
