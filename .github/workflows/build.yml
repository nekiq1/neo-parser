name: NEO PARSER - VERIFIED WINDOWS BUILD

on:
push:
branches:
- main
tags:
- "v*"
workflow_dispatch:

permissions:
contents: write

jobs:
build:
name: NEO VERIFIED BUILD
runs-on: windows-latest
timeout-minutes: 30

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Verify revision
    shell: pwsh
    run: |
      Write-Host "NEO_VERIFIED_BUILD_2026"
      Write-Host "Commit: $env:GITHUB_SHA"
      git log -1 --oneline

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: pip

  - name: Install dependencies
    shell: pwsh
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install "pyinstaller>=6.10,<7"

  - name: Verify project structure
    shell: pwsh
    run: |
      $files = @(
        "app.py",
        "requirements.txt",
        "tests/run.py",
        "tests/test_core.py",
        "tests/test_ai.py",
        "tests/test_api.py",
        "tests/test_browser_bootstrap.py",
        "static/index.html",
        "assets/cities.json"
      )

      foreach ($file in $files) {
        if (!(Test-Path $file)) {
          throw "Missing file: $file"
        }
        Write-Host "OK: $file"
      }

  - name: Run unit tests
    shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    run: |
      python -X utf8 tests/run.py test_core test_ai test_api test_browser_bootstrap

      if ($LASTEXITCODE -ne 0) {
        throw "UNIT TESTS FAILED"
      }

  - name: Clean previous builds
    shell: pwsh
    run: |
      Remove-Item build,dist -Recurse -Force -ErrorAction SilentlyContinue
      Remove-Item Neo_parser_win64.zip -Force -ErrorAction SilentlyContinue

  - name: Build EXE
    shell: pwsh
    run: |
      python -m PyInstaller `
        --noconfirm `
        --clean `
        --noconsole `
        --name "Neo parser" `
        --add-data "static;static" `
        --add-data "assets;assets" `
        --collect-all playwright `
        --collect-all webview `
        --distpath "dist" `
        --workpath "build" `
        --specpath "." `
        app.py

      if ($LASTEXITCODE -ne 0) {
        throw "PYINSTALLER FAILED"
      }

      if (!(Test-Path "dist\Neo parser\Neo parser.exe")) {
        throw "EXE NOT FOUND"
      }

  - name: NEO VERIFIED EXE BOOT TEST
    shell: pwsh
    timeout-minutes: 3
    run: |
      $out = "dist\Neo parser"
      $exe = Join-Path $out "Neo parser.exe"

      if (!(Test-Path $exe)) {
        throw "EXE NOT FOUND"
      }

      $psi = New-Object System.Diagnostics.ProcessStartInfo
      $psi.FileName = (Resolve-Path $exe).Path
      $psi.Arguments = "--self-test"
      $psi.WorkingDirectory = (Resolve-Path $out).Path
      $psi.UseShellExecute = $false
      $psi.CreateNoWindow = $true

      $process = New-Object System.Diagnostics.Process
      $process.StartInfo = $psi

      Write-Host "NEO_NEW_SMOKE_TEST_2026"
      Write-Host "Starting frozen application..."

      try {
        if (!$process.Start()) {
          throw "Windows failed to start Neo Parser"
        }

        if (!$process.WaitForExit(90000)) {
          $process.Kill()
          throw "EXE STARTUP TIMEOUT"
        }

        $code = $process.ExitCode

        Write-Host "ACTUAL EXE EXIT CODE: $code"

        if ($code -ne 0) {
          throw "EXE BOOT TEST FAILED: $code"
        }

        Write-Host "NEO EXE BOOT TEST PASSED"
      }
      finally {
        $process.Dispose()
      }

  - name: Prepare portable directory
    shell: pwsh
    run: |
      $out = "dist\Neo parser"

      New-Item -ItemType Directory -Force `
        "$out\databases",
        "$out\websites",
        "$out\logs" | Out-Null

      if (Test-Path README.md) {
        Copy-Item README.md "$out\README.md"
      }

      @(
        "@echo off"
        'cd /d "%~dp0"'
        'start "" "Neo parser.exe"'
      ) | Set-Content "$out\Start Neo parser.bat" -Encoding ASCII

      if (Test-Path "$out\browsers") {
        Remove-Item "$out\browsers" -Recurse -Force
      }

  - name: Create portable ZIP
    shell: pwsh
    run: |
      Compress-Archive `
        -Path "dist\Neo parser\*" `
        -DestinationPath "Neo_parser_win64.zip" `
        -CompressionLevel Optimal

      if (!(Test-Path Neo_parser_win64.zip)) {
        throw "ZIP CREATION FAILED"
      }

      $size = (Get-Item Neo_parser_win64.zip).Length / 1MB

      Write-Host "FINAL ZIP SIZE: $([math]::Round($size,2)) MB"

  - name: Verify ZIP
    shell: pwsh
    run: |
      Add-Type -AssemblyName System.IO.Compression.FileSystem

      $zip = [System.IO.Compression.ZipFile]::OpenRead(
        (Resolve-Path "Neo_parser_win64.zip").Path
      )

      try {
        $exe = $zip.Entries | Where-Object {
          $_.FullName -eq "Neo parser.exe"
        }

        if (!$exe) {
          throw "EXE MISSING FROM ZIP"
        }

        Write-Host "ZIP VERIFIED"
        Write-Host "FILES: $($zip.Entries.Count)"
      }
      finally {
        $zip.Dispose()
      }

  - name: Upload portable artifact
    uses: actions/upload-artifact@v4
    with:
      name: Neo_parser_win64
      path: Neo_parser_win64.zip
      if-no-files-found: error
      compression-level: 0
      retention-days: 30

  - name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: softprops/action-gh-release@v2
    with:
      files: Neo_parser_win64.zip