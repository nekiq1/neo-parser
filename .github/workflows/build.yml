name: Build Neo Parser

# Windows 10/11 x64  +  macOS Apple Silicon (M1+)
# Intel Mac не поддерживается.
#
# Важно: GitHub часто не выделяет macos runner (очередь).
# Windows job независим. Mac — best-effort в CI + локальный scripts/build_macos.sh.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest tests/ -q --tb=short

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Neo Parser" `
            --icon "assets/icon.ico" `
            --add-data "assets/icon.png;assets" `
            --add-data "assets/icon.ico;assets" `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            main.py

      - name: Verify
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/Neo Parser.exe")) {
            throw "dist/Neo Parser.exe not found"
          }
          Get-Item -LiteralPath "dist/Neo Parser.exe" | Format-List FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Neo-Parser-Windows-x64
          path: "dist/Neo Parser.exe"
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon (M1+)
    runs-on: macos-latest
    # Не валим весь workflow, если GitHub не дал runner / job упал
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require arm64 (M1+)
        run: |
          set -euo pipefail
          echo "arch=$(uname -m)"
          sw_vers || true
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::Need Apple Silicon arm64, got $(uname -m)"
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest tests/ -q --tb=short

      - name: Build .app
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --windowed \
            --name "Neo Parser" \
            --icon "assets/icon.png" \
            --add-data "assets/icon.png:assets" \
            --osx-bundle-identifier com.neki.neoparser \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            main.py
          test -x "dist/Neo Parser.app/Contents/MacOS/Neo Parser"
          file "dist/Neo Parser.app/Contents/MacOS/Neo Parser" | tee /tmp/bininfo.txt
          grep -qi arm64 /tmp/bininfo.txt

      - name: Codesign + DMG
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "dist/Neo Parser.app" || true
          hdiutil create \
            -volname "Neo Parser" \
            -srcfolder "dist/Neo Parser.app" \
            -ov -format UDZO \
            "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"
          ls -lh "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Neo-Parser-macOS-Apple-Silicon-arm64
          path: "dist/Neo-Parser-macOS-Apple-Silicon-arm64.dmg"
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Neo-Parser-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -ls || true

      - name: Require Windows exe
        run: test -f "artifacts/Neo Parser.exe"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          body: |
            **Neo Parser**
            - Windows 10/11 x64 — `Neo Parser.exe`
            - macOS Apple Silicon (M1+) — `Neo-Parser-macOS-Apple-Silicon-arm64.dmg` (если собрался в CI или добавлен вручную)
            Intel Mac не поддерживается.
